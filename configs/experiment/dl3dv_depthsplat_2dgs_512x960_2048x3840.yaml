# @package _global_

defaults:
  - /encoder: depthsplat
  - /dataset@dataset.dl3dv: dl3dv

wandb:
  name: automatic
  tags: [dl3dv, 512x960, 2048x3840]

encoder:
  pretrained_checkpoint_path: pretrained/depthsplat-gs-base-re10kdl3dv-448x768-randview2-6-f8ddd845.pth
  num_depth_candidates: 128
  costvolume_unet_feat_dim: 128
  costvolume_unet_channel_mult: [1, 1, 1]
  costvolume_unet_attn_res: [4]
  gaussians_per_pixel: 1
  depth_unet_feat_dim: 32
  depth_unet_attn_res: [16]
  depth_unet_channel_mult: [1, 1, 1, 1, 1]
  shim_patch_size: 16
  num_scales: 2
  upsample_factor: 4
  lowest_feature_resolution: 8
  monodepth_vit_type: vitb
  gaussian:
    gaussian_scale_max: 0.1

  # Different from official DepthSplat
  supervise_intermediate_depth: false
  return_depth: false
  freeze_depth_predictor: true
rasterizer:
  make_scale_invariant: true
  backend: gsplat_2dgs

dataset:
  dl3dv:
    roots: [data/dl3dv]
    skip_bad_shape: true
    input_image_shape: [512, 960]
    original_image_shape: [2160, 3840]
    view_sampler:
      warm_up_steps: 10000
      min_distance_between_context_views: 8
      max_distance_between_context_views: 16
    view_sampler_on_test:
      index_path: assets/dl3dv_start_0_distance_10_ctx_2v_tgt_4v.json
      num_context_views: 2

    # DepthSplat specific
    normalize_scene_scale: false
    relative_pose: false
    near: 0.5
    far: 200.0

train:
  train_target_image_shape: [2048, 3840]
  disable_validation_videos: true
  validation_lpips_metric_max_dim: 512

test:
  enable_pose_opt: false
  test_target_image_shape: [2048, 3840]
  lpips_metric_max_dim: 1024

loss:
  lpips:
    lpips_loss_max_dim: 512
    enable_eager_grads: true

optimizer:
  lr: 2e-4
  warm_up_steps: 125
  backbone_lr_mult: 0.1
  non_head_lr_mult: null
  non_2dgs_lr_mult: null

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 20000
  val_check_interval: 500

checkpointing:
  every_n_train_steps: 10000
  test_ckpt_path: checkpoints/epoch_0-step_20000.ckpt
