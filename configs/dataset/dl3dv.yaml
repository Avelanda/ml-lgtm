name: dl3dv
roots: [data/dl3dv]

input_image_shape: [256, 256]
original_image_shape: [270, 480]
normalize_scene_scale: true
relative_pose: true
augment: true
background_color: [0.0, 0.0, 0.0]
skip_bad_shape: true

baseline_min: 1e-3
baseline_max: 1e2
max_fov: 100.0

view_sampler:
  name: bounded
  num_target_views: 4
  num_context_views: 2
  min_distance_between_context_views: 8
  max_distance_between_context_views: 16
  min_distance_to_context_views: 0
  warm_up_steps: 150000
  initial_min_distance_between_context_views: 5
  initial_max_distance_between_context_views: 7

view_sampler_on_test:
  name: evaluation
  index_path: assets/dl3dv_start_0_distance_10_ctx_2v_tgt_4v.json
  num_context_views: 2
